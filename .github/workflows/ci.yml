name: CI

# Runs once per change: on pull requests and on main. A push to a feature branch is
# covered by its pull request, so it does not start a second run of the same commit.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Keel.sln

      - name: Build (Release)
        run: dotnet build Keel.sln -c Release --no-restore

      - name: Test (Release)
        run: dotnet test Keel.sln -c Release --no-build -m:1 --logger "trx;LogFilePrefix=${{ matrix.os }}" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

  lint:
    name: Format and vulnerable packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Keel.sln

      - name: Check the packaging scripts (dry run)
        run: |
          bash -n build/package.sh
          bash build/package.sh --dry-run --rid linux-x64 --rid win-x64

      - name: Verify formatting
        run: dotnet format Keel.sln --verify-no-changes --no-restore --verbosity diagnostic

      - name: Scan for vulnerable packages
        shell: bash
        run: |
          dotnet list Keel.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi
