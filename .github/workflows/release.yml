name: Release

# Builds the installers for every platform from a version tag (PRD 8, PRD 12 M8 exit, ADR 0083) and
# publishes them, with Velopack's update feeds, as one GitHub release. The tag must match the version in
# Directory.Build.props (for example v1.0.0-rc.1). Signing is optional: without the secrets the
# packages are unsigned.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check the tag matches the version
        shell: bash
        run: |
          version="$(dotnet msbuild src/Keel.Desktop/Keel.Desktop.csproj -getProperty:Version | tr -d '[:space:]')"
          echo "Version $version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version v$version in Directory.Build.props"
            exit 1
          fi

      - name: Test
        run: dotnet test Keel.sln -c Release -m:1

      - name: Package Windows (win-x64, win-arm64)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          KEEL_WIN_SIGN_TEMPLATE: ${{ secrets.KEEL_WIN_SIGN_TEMPLATE }}
        run: ./build/package.ps1 -Rid win-x64,win-arm64

      - name: Package macOS (osx-arm64, osx-x64)
        if: runner.os == 'macOS'
        env:
          KEEL_MAC_APP_IDENTITY: ${{ secrets.KEEL_MAC_APP_IDENTITY }}
          KEEL_MAC_INSTALL_IDENTITY: ${{ secrets.KEEL_MAC_INSTALL_IDENTITY }}
          KEEL_MAC_NOTARY_PROFILE: ${{ secrets.KEEL_MAC_NOTARY_PROFILE }}
        run: bash build/package.sh --rid osx-arm64 --rid osx-x64

      - name: Package Linux (linux-x64)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          bash build/package.sh --rid linux-x64

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: artifacts/releases
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: releases
          pattern: packages-*

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          mapfile -t files < <(find releases -type f | sort)
          printf 'Uploading %s\n' "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "Keel ${GITHUB_REF_NAME#v}" --generate-notes "${prerelease[@]}"
